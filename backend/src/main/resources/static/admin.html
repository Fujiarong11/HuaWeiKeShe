<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园问答 - 后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

        /* 登录页 */
        .login-container {
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 360px; text-align: center;
        }
        .login-box h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
        .login-box p { font-size: 13px; color: #999; margin-bottom: 24px; }
        .login-box input {
            width: 100%; height: 44px; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 0 16px; font-size: 15px; margin-bottom: 16px; outline: none;
        }
        .login-box input:focus { border-color: #667eea; }
        .login-box button {
            width: 100%; height: 44px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }

        /* 管理面板 */
        .dashboard { display: none; }
        .header {
            background: #fff; padding: 0 32px; height: 60px; display: flex;
            align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .header h1 { font-size: 18px; }
        .header button {
            padding: 8px 20px; border: 1px solid #e0e0e0; background: #fff;
            border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .header button:hover { background: #f5f5f5; }
        .content { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

        /* 统计卡片 */
        .stats { display: flex; gap: 20px; margin-bottom: 24px; }
        .stat-card {
            flex: 1; background: #fff; padding: 24px; border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center;
        }
        .stat-card .num { font-size: 32px; font-weight: bold; color: #667eea; }
        .stat-card .label { font-size: 13px; color: #999; margin-top: 8px; }

        /* 用户表格 */
        .table-box {
            background: #fff; border-radius: 10px; padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .table-box h2 { font-size: 16px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 8px; border-bottom: 2px solid #f0f0f0; color: #999; font-weight: 500; }
        td { padding: 12px 8px; border-bottom: 1px solid #f5f5f5; }
        tr:hover td { background: #fafafa; }
        .btn-del {
            padding: 4px 12px; background: #e74c3c; color: #fff; border: none;
            border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-del:hover { background: #c0392b; }
        .empty { text-align: center; color: #bbb; padding: 40px 0; }
        .toast {
            position: fixed; top: 20px; right: 20px; background: #27ae60; color: #fff;
            padding: 12px 24px; border-radius: 6px; font-size: 14px; display: none; z-index: 999;
        }
        .loading-text { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>

<!-- 登录 -->
<div class="login-container" id="loginPage">
    <div class="login-box">
        <h1>🎓 后台管理</h1>
        <p>校园问答互助平台</p>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')login()">
        <button onclick="login()">登 录</button>
        <div class="login-error" id="loginError">密码错误</div>
    </div>
</div>

<!-- 管理面板 -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <h1>🎓 校园问答 - 后台管理</h1>
        <button onclick="logout()">退出登录</button>
    </div>
    <div class="content">
        <div class="stats">
            <div class="stat-card">
                <div class="num" id="statUsers">-</div>
                <div class="label">注册用户</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statQuestions">-</div>
                <div class="label">总提问数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statAnswers">-</div>
                <div class="label">总回答数</div>
            </div>
        </div>
        <div class="table-box">
            <h2>👥 用户列表</h2>
            <div id="userTable"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/admin';

// 登录
function login() {
    const pwd = document.getElementById('adminPwd').value;
    fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
    })
    .then(r => r.json())
    .then(res => {
        if (res.code === 0) {
            sessionStorage.setItem('admin_token', res.data.token);
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadData();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    });
}

// 退出
function logout() {
    sessionStorage.removeItem('admin_token');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('adminPwd').value = '';
}

// 加载数据
function loadData() {
    loadStats();
    loadUsers();
}

function loadStats() {
    fetch(API + '/stats')
    .then(r => r.json())
    .then(res => {
        if (res.code === 0) {
            document.getElementById('statUsers').textContent = res.data.totalUsers;
            document.getElementById('statQuestions').textContent = res.data.totalQuestions;
            document.getElementById('statAnswers').textContent = res.data.totalAnswers;
        }
    });
}

function loadUsers() {
    document.getElementById('userTable').innerHTML = '<div class="loading-text">加载中...</div>';
    fetch(API + '/users')
    .then(r => r.json())
    .then(res => {
        if (res.code === 0 && res.data.length > 0) {
            let html = `<table>
                <tr><th>ID</th><th>手机号</th><th>用户名</th><th>昵称</th><th>学院</th><th>专业</th><th>声望</th><th>注册时间</th><th>操作</th></tr>`;
            res.data.forEach(u => {
                html += `<tr>
                    <td>${u.id}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${u.username || '-'}</td>
                    <td>${u.name || '-'}</td>
                    <td>${u.college || '-'}</td>
                    <td>${u.major || '-'}</td>
                    <td>${u.reputation || 0}</td>
                    <td>${u.createdAt || '-'}</td>
                    <td><button class="btn-del" onclick="deleteUser(${u.id})">删除</button></td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('userTable').innerHTML = html;
        } else {
            document.getElementById('userTable').innerHTML = '<div class="empty">暂无用户数据</div>';
        }
    });
}

function deleteUser(id) {
    if (!confirm('确定要删除该用户吗？此操作不可恢复！')) return;
    fetch(API + '/users/' + id, { method: 'DELETE' })
    .then(r => r.json())
    .then(res => {
        if (res.code === 0) {
            showToast('删除成功');
            loadData();
        } else {
            showToast('删除失败: ' + (res.msg || '未知错误'));
        }
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

// 自动登录检查
if (sessionStorage.getItem('admin_token')) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
}
</script>
</body>
</html>
